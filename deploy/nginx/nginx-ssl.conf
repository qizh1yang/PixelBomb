events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Timeout settings for VERY slow connections (Optimized for 1-2MB/s)
    client_body_timeout 600s;
    client_header_timeout 600s;
    send_timeout 600s;
    keepalive_timeout 600s;
    lingering_timeout 30s;
    lingering_close on;
    
    # Buffer settings for large files
    client_max_body_size 100M;
    client_body_buffer_size 128k;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    sendfile_max_chunk 512k; # Prevent worker blocking
    
    # Enable aggressive gzip compression for faster loading
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript 
               application/javascript application/xml+rss application/json 
               application/wasm application/octet-stream;

    # HTTP server - redirect to HTTPS
    server {
        listen 80;
        server_name _;
        
        # Redirect all HTTP to HTTPS
        return 301 https://$host$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name _;

        # SSL certificate paths (will be generated)
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_buffer_size 4k; # Better for low latency/stability

        # Root directory for Godot web export
        root /usr/share/nginx/html;
        index index.html;

        # 1. 精确匹配 Service Worker 核心，必须严格禁用缓存，允许 Service-Worker-Allowed 根目录
        location = /sw.js {
            types {
                application/javascript js;
            }
            add_header Cross-Origin-Opener-Policy same-origin always;
            add_header Cross-Origin-Embedder-Policy require-corp always;
            add_header Cross-Origin-Resource-Policy cross-origin always;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Service-Worker-Allowed "/" always;
            expires 0;
        }


        # 3. 精确匹配版本探测脚本，严禁缓存
        location = /version-detector.js {
            types {
                application/javascript js;
            }
            add_header Cross-Origin-Opener-Policy same-origin always;
            add_header Cross-Origin-Embedder-Policy require-corp always;
            add_header Cross-Origin-Resource-Policy cross-origin always;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            expires 0;
        }

        # 4. 入口 HTML 页面，严禁缓存
        location = /index.html {
            add_header Cross-Origin-Opener-Policy same-origin always;
            add_header Cross-Origin-Embedder-Policy require-corp always;
            add_header Cross-Origin-Resource-Policy cross-origin always;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            expires 0;
        }

        # 5. manifest.json 版本索引，严禁缓存 (客户端每次请求必须拿到最新版本)
        location = /manifest.json {
            types {
                application/json json;
            }
            add_header Cross-Origin-Opener-Policy same-origin always;
            add_header Cross-Origin-Embedder-Policy require-corp always;
            add_header Cross-Origin-Resource-Policy cross-origin always;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            expires 0;
        }

        # 6. 版本化资源 (game.{hash}.pck, game.{hash}.wasm) — URL 不可变，可长期缓存
        location ~ "^/game\.[a-f0-9]{7,}\.(pck|wasm)$" {
            add_header Cross-Origin-Opener-Policy same-origin always;
            add_header Cross-Origin-Embedder-Policy require-corp always;
            add_header Cross-Origin-Resource-Policy cross-origin always;
            add_header Access-Control-Allow-Origin "*" always;
            # 版本化资源 URL 唯一不可变, 缓存 1 年
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            gzip off;
            gzip_static off;
        }

        # 同样支持时间戳格式的版本化资源 (game.YYYYMMDD-HHMMss.pck)
        location ~ "^/game\.\d{8}-\d{6}\.(pck|wasm)$" {
            add_header Cross-Origin-Opener-Policy same-origin always;
            add_header Cross-Origin-Embedder-Policy require-corp always;
            add_header Cross-Origin-Resource-Policy cross-origin always;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            gzip off;
            gzip_static off;
        }

        # Serve static files - 静态资源默认走协商缓存以备 SW 容灾，防止被强缓存锁死
        location / {
            try_files $uri $uri/ /index.html;
            
            # Headers for Godot Web with HTTPS
            add_header Cross-Origin-Opener-Policy same-origin always;
            add_header Cross-Origin-Embedder-Policy require-corp always;
            add_header Cross-Origin-Resource-Policy cross-origin always;
            add_header Access-Control-Allow-Origin "*" always;
            
            # 采用协商缓存，保障每次请求文件都会回源确认 ETag 是否变更
            add_header Cache-Control "no-cache" always;
        }

        # Special handling for .js files
        location ~ \.js$ {
            types {
                application/javascript js;
            }
            add_header Cross-Origin-Opener-Policy same-origin always;
            add_header Cross-Origin-Embedder-Policy require-corp always;
            add_header Cross-Origin-Resource-Policy cross-origin always;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cache-Control "no-cache" always;
            gzip on;
            gzip_static on;
        }

        # WebSocket proxy to Go server (WSS)
        location /ws {
            proxy_pass http://game-server:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket timeout settings
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # Special handling for .wasm files
        location ~ \.wasm$ {
            types {
                application/wasm wasm;
            }
            add_header Cross-Origin-Opener-Policy same-origin always;
            add_header Cross-Origin-Embedder-Policy require-corp always;
            add_header Cross-Origin-Resource-Policy cross-origin always;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cache-Control "no-cache" always;
            gzip off; # Disable real-time compression for stability
            gzip_static off;
        }

        # Special handling for .pck files
        location ~ \.pck$ {
            types {
                application/octet-stream pck;
            }
            add_header Cross-Origin-Opener-Policy same-origin always;
            add_header Cross-Origin-Embedder-Policy require-corp always;
            add_header Cross-Origin-Resource-Policy cross-origin always;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cache-Control "no-cache" always;
            gzip off; # Disable real-time compression for stability
            gzip_static off;
        }
    }
}
