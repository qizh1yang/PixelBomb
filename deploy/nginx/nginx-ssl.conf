events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Timeout settings for VERY slow connections (Optimized for 1-2MB/s)
    client_body_timeout 600s;
    client_header_timeout 600s;
    send_timeout 600s;
    keepalive_timeout 600s;
    lingering_timeout 30s;
    lingering_close on;
    
    # Buffer settings for large files
    client_max_body_size 100M;
    client_body_buffer_size 128k;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    sendfile_max_chunk 512k; # Prevent worker blocking
    
    # Enable aggressive gzip compression for faster loading
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript 
               application/javascript application/xml+rss application/json 
               application/wasm application/octet-stream;

    # HTTP server - redirect to HTTPS
    server {
        listen 80;
        server_name _;
        
        # Redirect all HTTP to HTTPS
        return 301 https://$host$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name _;

        # SSL certificate paths (will be generated)
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_buffer_size 4k; # Better for low latency/stability

        # Root directory for Godot web export
        root /usr/share/nginx/html;
        index index.html;

        # Serve static files
        location / {
            try_files $uri $uri/ /index.html;
            
            # Headers for Godot Web with HTTPS
            add_header Cross-Origin-Opener-Policy same-origin always;
            add_header Cross-Origin-Embedder-Policy require-corp always;
            add_header Cross-Origin-Resource-Policy cross-origin always;
            add_header Access-Control-Allow-Origin "*" always;
            
            # Aggressive caching for static assets (1 week)
            add_header Cache-Control "public, max-age=604800, immutable" always;
        }

        # Special handling for .js files
        location ~ \.js$ {
            types {
                application/javascript js;
            }
            add_header Cross-Origin-Opener-Policy same-origin always;
            add_header Cross-Origin-Embedder-Policy require-corp always;
            add_header Cross-Origin-Resource-Policy cross-origin always;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cache-Control "public, max-age=3600" always;
            gzip on;
            gzip_static on;
        }

        # WebSocket proxy to Go server (WSS)
        location /ws {
            proxy_pass http://bomberman-server:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket timeout settings
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # Special handling for .wasm files
        location ~ \.wasm$ {
            types {
                application/wasm wasm;
            }
            add_header Cross-Origin-Opener-Policy same-origin always;
            add_header Cross-Origin-Embedder-Policy require-corp always;
            add_header Cross-Origin-Resource-Policy cross-origin always;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cache-Control "public, max-age=604800" always;
            gzip off; # Disable real-time compression for stability
            gzip_static off;
        }

        # Special handling for .pck files
        location ~ \.pck$ {
            types {
                application/octet-stream pck;
            }
            add_header Cross-Origin-Opener-Policy same-origin always;
            add_header Cross-Origin-Embedder-Policy require-corp always;
            add_header Cross-Origin-Resource-Policy cross-origin always;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cache-Control "public, max-age=604800" always;
            gzip off; # Disable real-time compression for stability
            gzip_static off;
        }
    }
}
