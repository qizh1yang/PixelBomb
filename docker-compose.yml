version: '3.8'

services:
  # 1. PixelBomb Go WebSocket Server
  game-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: pb-game-server
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis:6379
      - ENV=production
      - METRICS_PORT=9090
      - LOG_LEVEL=info
    ports:
      - "8080:8080" # Web Socket port
      - "9090:9090" # Prometheus metrics collection port
    depends_on:
      - redis
    volumes:
      - ./server/storage:/app/storage
    networks:
      - pb-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 2. Redis Cache Store (For Session Routing & Matchmaking Extension)
  redis:
    image: redis:7.0-alpine
    container_name: pb-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - pb-redis-data:/data
    networks:
      - pb-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 3. Nginx Web & Reverse Proxy Server
  web:
    image: nginx:alpine
    container_name: pb-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./client/export/web:/usr/share/nginx/html:ro
      - ./deploy/nginx/nginx-ssl.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - game-server
    networks:
      - pb-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 80"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  pb-network:
    driver: bridge

volumes:
  pb-redis-data:
